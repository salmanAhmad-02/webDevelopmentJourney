<!DOCTYPE html>
<html lang="en">
<head>
    <title>WDJ</title>
</head>
<body>
    <!-- target attribute -->
    <!-- value = -blank, tells the bwoser to open the link in new tab -->

    <p><b>With target _blank : </b><a href="https://www.linkedin.com/in/salman-ahmad-profile/" target="_blank">Salman Ahmad</a></p><br>

    <!-- value=_self, link will open the same tab -->
    <p><b>With target _self : </b><a href="https://www.linkedin.com/in/salman-ahmad-profile/" target="_blank">Salman Ahmad</a></p>

    <!-- there are more target like parent and top , i will cover them later -->
</body> 
</html>
