    <body>
        <!-- Standard Input Types -->
        <!-- Some attributes that used inside a form -->
        <h3>Covering Standard Input types or Fields</h3>

        <form action="validations.js">
            <label class="fName">First Name :</label>
            <input type="text" name="firstName" id="firstName" placeholder="Enter Your Name" required><br><br>

            <label class="mName">Middle Name :</label>
            <input type="text" name="middleName" id="middleName" placeholder="Enter Your Middle Name"><br><br>

            <label class="lName">Last Name :</label>
            <input type="text" name="lastName" id="lastName" placeholder="Enter Your Last Name" required><br><br>


        </form>
    </body>
</html>
