<!DOCTYPE html>
<html lang="en">
    <head>
        <title>WDJ</title>
    </head>
    <body>
        <!-- Standard Input Types -->
        <!-- Some attributes that used inside a form -->
        <h3>Covering Standard Input types or Fields</h3>

        <form action="validations.js">
            <label class="fName">First Name :</label>
            <input type="text" name="firstName" id="firstName" placeholder="Enter Your Name" required><br><br>

            <label class="mName">Middle Name :</label>
            <input type="text" name="middleName" id="middleName" placeholder="Enter Your Middle Name"><br><br>

            <label class="lName">Last Name :</label>
            <input type="text" name="lastName" id="lastName" placeholder="Enter Your Last Name" required><br><br>

            <label id="gender">Select Gender :</label>
            <input type="radio" id="male" name="gender">Male
            <input type="radio" id="female" name="gender">Female
            <input type="radio" id="other" name="gender">Other
            <input type="radio" id="pnts" name="gender">Prefer not to say
            <br><br>

            <label for="States">Select Your State</label>
            <select name="State" id="State">
                <option>Select state</option>
                <option>Aandhara Pradesh</option>
                <option>Arunanchal Pradesh</option>
                <option>Bihar</option>
                <option>Jharkhan</option>
                <option>West Bengal</option>
                <option>Aasam</option>
                <option>Odisa</option>
                <option>Himanchal Pradesh</option>
                <option>Mijoram</option>
                <option>Manipur</option>
                <option>Uttarakhand</option>
                <option>Jammu and Kashmir</option>
                <option>Delhi</option>
                <option>Hariyana</option>
                <option>Punjab</option>
                <option>Uttar pradesh</option>
                <option>Madya Pradesh</option>
                <option>Maharashra</option>
                <option>Gujrat</option>
                <option>Rajasthan</option>
                <option>other that not mentioned</option>
            </select>
            <br><br>

                <label id="GovIDs">Having IDs :</label>
                <input type="checkbox" id="Aadhar" name="ids">Aadhar Card
                <input type="checkbox" id="Pan" name="ids">Pan Card
                <input type="checkbox" id="Voterid" name="ids">Voter Id
                <input type="checkbox" id="DL" name="ids">Driving Licence
                <input type="checkbox" id="passport" name="ids">Passport
            
        </form>
    </body>
</html>
