<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Tables</title>
    </head>
    <body>
        <!-- We style our table through the css , but while we had not moved to css yet , so we use border attribute  -->
        <Table border="1"> 
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
            <tr>
                <td>Saif</td>
                <td>45</td>
            </tr>
            <tr>
                <td>Shahid</td>
                <td>44</td>
            </tr>
        </Table>
    </body>
</html>
