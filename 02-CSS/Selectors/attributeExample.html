<!DOCTYPE html>
<html lang="en">
    <head>
        <title>WDJ</title>
        <link rel="stylesheet" href="attributeSelector.css">
    </head>
    <body>
        <form >
            <label for="fName">First Name :</label>
            <input type="text" name="fname" id="fName" placeholder="Enter Your First Name">
            <br><br>

            <label for="lName">Last Name :</label>
            <input type="text" name="lname" id="lName" placeholder="Enter Your Last Name">
            <br><br>

            <label for="pass">Password :</label>
            <input type="password" name="pass" id="pass" placeholder="Enter Your Password">
            <br><br>

            <label for="smtbtn">Click To Submit :</label>
            <input type="button" name="submit" id="smtbtn" value="Submit">

            <label for="rstbtn">Reset Enteries :</label>
            <input type="button" name="reset" id="rstbtn" value="Reset">
        </form>
    </body>
</html>
